# Test configuration - uses WireMock to mock Ollama API
# This allows tests to run without requiring a local Ollama instance
# WireMock mappings are in src/test/resources/mappings/
#
# Main application config (src/main/resources/application.properties) has:
# - Ollama configuration for dev mode (localhost:11434)
# - Model configuration (llama3.2:1b)
# - Logging settings
#
# This test config only overrides what's needed for WireMock:

# Enable WireMock dev service
quarkus.wiremock.devservices.enabled=true

# Override Ollama base URL to point to WireMock (keeps Ollama client for API compatibility)
quarkus.langchain4j.ollama.base-url=http://localhost:${quarkus.wiremock.devservices.port}

# Enable request/response logging for debugging
quarkus.langchain4j.ollama.log-requests=true
quarkus.langchain4j.ollama.log-responses=true
