# Quarkus Application Configuration
quarkus.application.name=quarkus-embabel-example-agent

# Ollama Configuration (local LLM, no API keys required)
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=gemma4
quarkus.langchain4j.ollama.chat-model.temperature=0.7
quarkus.langchain4j.ollama.timeout=60s

# Embabel Model Configuration
embabel.models.default-llm=gemma4

# LLM Roles: Create as many as you want and use with byRole("role-name")
embabel.models.llms.best=gemma4
embabel.models.llms.cheapest=gemma4

# Embedding models (if needed)
#embabel.models.default-embedding-model=nomic-embed-text:latest
#embabel.models.embedding-services.best=nomic-embed-text:latest
#embabel.models.embedding-services.cheapest=nomic-embed-text:latest

# Agent Configuration (Spring Boot properties work via quarkus-spring-boot-properties)
storyWordCount=100
reviewWordCount=100

# Set this to use your preferred LLM for ranking, to avoid default
#embabel.agent-platform.ranking.llm=qwen2.5:7b

# Logging personality (fun feature from Embabel)
embabel.agent.logging.personality=starwars

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."io.quarkiverse.embabel".level=DEBUG
quarkus.log.category."com.embabel".level=DEBUG