# Test configuration for Embabel Agent integration tests
# This configures a mock ChatModel for testing without real API calls using WireMock

# Enable WireMock dev service
quarkus.wiremock.devservices.enabled=true

# Configure OpenAI to use WireMock
quarkus.langchain4j.openai.api-key=test-key
quarkus.langchain4j.openai.base-url=http://localhost:${quarkus.wiremock.devservices.port}/v1
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.0
quarkus.langchain4j.openai.embedding-model.enabled=true
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-ada-002
quarkus.langchain4j.openai.timeout=10s
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true

# Embabel model configuration
embabel.models.default-llm=gpt-4o-mini
embabel.models.default-embedding-model=text-embedding-ada-002

# Embabel platform configuration - verifies config binding works
embabel.agent.platform.name=test-platform
embabel.agent.platform.description=Integration Test Platform

# Embabel ToolLoop configuration - verifies nested config binding
embabel.agent.platform.toolloop.type=PARALLEL
embabel.agent.platform.toolloop.max-iterations=3
embabel.agent.platform.toolloop.parallel.per-tool-timeout=20s
embabel.agent.platform.toolloop.parallel.batch-timeout=45s

# Debug logging
quarkus.log.category."com.embabel.agent.spi.support".level=TRACE
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG
quarkus.log.category."io.quarkiverse.embabel".level=DEBUG